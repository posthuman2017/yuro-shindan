<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>有料老人ホーム 簡易経営診断</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-head no-print">
  <div class="brand">
    <h1>有料老人ホーム 簡易経営診断</h1>
    <p>介護付有料老人ホーム／住宅型有料老人ホーム／サービス付き高齢者向け住宅</p>
  </div>
  <nav class="tabs">
    <button class="tab active" data-v="form">診断入力</button>
    <button class="tab" data-v="result">診断結果</button>
    <button class="tab" data-v="sheet">質問票を印刷</button>
    <button class="tab" data-v="records">保存・集計</button>
  </nav>
</header>

<p class="privacy no-print" id="privacy"></p>

<main id="view"></main>

<footer class="app-foot no-print">
  <p>本診断は公表された統計・制度資料にもとづく簡易診断です。数値の出典は診断書の末尾に記載しています。</p>
</footer>

<div id="toast"></div>

<script src="js/config.js"></script>
<script src="js/questions.js"></script>
<script src="js/score.js"></script>
<script src="js/chart.js"></script>
<script src="js/app.js"></script>
</body>
</html>
